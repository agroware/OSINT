<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRO OSINT // MULTI-VECTOR RECON</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0a0a0a; color: #e0e0e0;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden; height: 100vh; width: 100vw; position: relative;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.02) 0%, transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.02) 0%, transparent 40%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 8px);
      pointer-events: none; z-index: 0;
    }
    .app-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; z-index: 5; pointer-events: none;
    }
    .globe-section { flex: 1; position: relative; pointer-events: auto; min-width: 0; }
    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1; cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }
    .search-section {
      width: 580px; max-width: 55vw; height: 100%; position: relative;
      pointer-events: auto; display: flex; flex-direction: column; z-index: 50;
      padding: 2rem 2rem 2rem 0;
      background: linear-gradient(90deg, transparent 0%, rgba(10,10,10,0.6) 15%, rgba(10,10,10,0.95) 100%);
      overflow: hidden;
    }
    .top-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      width: 100%; padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.15); margin-bottom: 1.2rem;
    }
    .top-header .brand-block { display: flex; flex-direction: column; gap: 0.3rem; }
    .top-header .brand {
      font-size: 1.8rem; font-weight: 600; letter-spacing: 0.35em; line-height: 1;
      color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.3); text-transform: uppercase;
    }
    .top-header .brand span { color: #b0b0b0; font-weight: 300; font-size: 1rem; letter-spacing: 0.2em; margin-left: 0.4rem; }
    .top-header .subtitle { font-size: 0.55rem; letter-spacing: 0.3em; color: #666; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
    .top-header .meta-info { display: flex; gap: 1.5rem; font-size: 0.6rem; color: #888; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; }
    .top-header .meta-info div { display: flex; flex-direction: column; align-items: flex-end; }
    .top-header .meta-info .label { color: #555; font-size: 0.5rem; margin-bottom: 0.15rem; }
    .top-header .meta-info .value { color: #ddd; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 0.1rem; }
    .mode-tabs { display: flex; gap: 0.3rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .mode-tab {
      background: rgba(20,20,20,0.8); border: 1px solid rgba(255,255,255,0.1);
      color: #888; padding: 0.5rem 0.8rem; font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; transition: all 0.2s;
      display: flex; align-items: center; gap: 0.35rem; white-space: nowrap;
    }
    .mode-tab .tab-icon { font-size: 0.85rem; opacity: 0.7; }
    .mode-tab:hover { background: rgba(40,40,40,0.9); border-color: rgba(255,255,255,0.25); color: #ccc; }
    .mode-tab.active { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.5); color: #fff; box-shadow: 0 0 12px rgba(255,255,255,0.1); }
    .mode-tab.active .tab-icon { opacity: 1; }
    .search-area { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1rem; }
    .search-area label { font-size: 0.6rem; letter-spacing: 0.15em; color: #777; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
    .search-input-wrapper { display: flex; gap: 0.5rem; }
    .search-input-wrapper input {
      flex: 1; background: rgba(15,15,15,0.9); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; padding: 0.8rem 0.9rem; font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem; outline: none; border-radius: 2px; transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.02em;
    }
    .search-input-wrapper input:focus { border-color: rgba(255,255,255,0.5); background: rgba(25,25,25,0.95); }
    .search-input-wrapper input::placeholder { color: #4a4a4a; font-size: 0.75rem; }
    .search-input-wrapper button {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 0 1.3rem; font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem; letter-spacing: 0.1em; cursor: pointer;
      border-radius: 2px; transition: all 0.2s; display: flex; align-items: center;
      gap: 0.4rem; white-space: nowrap; text-transform: uppercase;
    }
    .search-input-wrapper button:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
    .search-input-wrapper button:active { background: rgba(255,255,255,0.3); transform: scale(0.97); }
    .search-input-wrapper button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .scan-status {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.6rem; color: #777; padding: 0.4rem 0;
      border-bottom: 1px dashed rgba(255,255,255,0.08);
      border-top: 1px dashed rgba(255,255,255,0.08);
      margin-bottom: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .scan-status .status-text { display: flex; align-items: center; gap: 0.4rem; }
    .scan-status .status-text .dot {
      width: 5px; height: 5px; border-radius: 50%; background: #4aff8c;
      box-shadow: 0 0 6px #4aff8c; animation: pulse 2s infinite;
    }
    .scan-status .status-text .dot.scanning { background: #ffaa33; box-shadow: 0 0 6px #ffaa33; animation: pulse 1s infinite; }
    .scan-status .status-text .dot.error { background: #ff4a4a; box-shadow: 0 0 6px #ff4a4a; animation: none; }
    .scan-status .status-text .dot.done { background: #4aff8c; box-shadow: 0 0 6px #4aff8c; animation: none; }
    @keyframes pulse {
      0% { opacity: 0.6; box-shadow: 0 0 4px currentColor; }
      50% { opacity: 1; box-shadow: 0 0 12px currentColor; }
      100% { opacity: 0.6; box-shadow: 0 0 4px currentColor; }
    }
    .results-container {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
      gap: 0.6rem; padding-right: 0.4rem; scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent; min-height: 0;
    }
    .results-container::-webkit-scrollbar { width: 4px; }
    .results-container::-webkit-scrollbar-track { background: transparent; }
    .results-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    .result-item {
      background: rgba(255,255,255,0.03); border-left: 2px solid rgba(255,255,255,0.2);
      padding: 0.7rem 0.9rem; border-radius: 1px; font-size: 0.7rem;
      line-height: 1.55; transition: background 0.2s, border-color 0.2s;
      animation: fadeIn 0.3s ease; display: flex; flex-direction: column; gap: 0.3rem;
    }
    .result-item:hover { background: rgba(255,255,255,0.07); border-left-color: rgba(255,255,255,0.6); }
    .result-item .source {
      display: flex; align-items: center; gap: 0.5rem; color: #aaa;
      font-size: 0.6rem; letter-spacing: 0.05em; font-family: 'JetBrains Mono', monospace;
      flex-wrap: wrap;
    }
    .result-item .source .tag {
      background: rgba(255,255,255,0.1); padding: 0.15rem 0.5rem;
      border-radius: 1px; font-size: 0.55rem; color: #ccc;
      border: 1px solid rgba(255,255,255,0.08); text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .result-item .source .tag.gaming { background: rgba(100,150,255,0.15); border-color: rgba(100,150,255,0.3); color: #8ab4ff; }
    .result-item .source .tag.discord { background: rgba(88,101,242,0.15); border-color: rgba(88,101,242,0.4); color: #7289da; }
    .result-item .source .tag.steam { background: rgba(23,105,170,0.15); border-color: rgba(23,105,170,0.4); color: #66c0f4; }
    .result-item .source .tag.social { background: rgba(255,100,100,0.12); border-color: rgba(255,100,100,0.3); color: #ff8a8a; }
    .result-item .source .tag.breach { background: rgba(255,60,60,0.15); border-color: rgba(255,60,60,0.4); color: #ff6b6b; }
    .result-item .source .tag.dark { background: rgba(180,60,255,0.12); border-color: rgba(180,60,255,0.3); color: #c48aff; }
    .result-item .data { color: #e0e0e0; font-weight: 400; word-break: break-word; }
    .result-item .data .highlight { color: #fff; background: rgba(255,255,255,0.1); padding: 0 0.2rem; border-radius: 1px; }
    .result-item .data .game-tag {
      display: inline-block; background: rgba(100,200,100,0.12);
      border: 1px solid rgba(100,200,100,0.25); color: #8aff8a;
      padding: 0 0.3rem; border-radius: 1px; font-size: 0.6rem; margin: 0 0.1rem;
    }
    .result-item .meta {
      display: flex; justify-content: space-between; font-size: 0.55rem;
      color: #555; margin-top: 0.1rem; font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
    }
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 2.5rem 0.5rem; color: #555;
      font-size: 0.65rem; text-align: center; gap: 0.6rem;
      letter-spacing: 0.05em; font-family: 'JetBrains Mono', monospace;
    }
    .empty-state .icon { font-size: 2rem; opacity: 0.25; }
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 1.5px solid rgba(255,255,255,0.2); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .error-message {
      background: rgba(255,80,80,0.1); border-left: 2px solid #ff4a4a;
      color: #ff8a8a; padding: 0.6rem 0.9rem; font-size: 0.65rem;
      border-radius: 1px; animation: fadeIn 0.2s ease;
      font-family: 'JetBrains Mono', monospace;
    }
    .search-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 0.8rem; margin-top: 0.5rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-family: 'JetBrains Mono', monospace; font-size: 0.55rem;
      color: #444; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .search-footer .status-group { display: flex; gap: 1.2rem; align-items: center; }
    .search-footer .status-group span { display: flex; align-items: center; gap: 0.35rem; }
    .search-footer .status-group .dot {
      display: inline-block; width: 5px; height: 5px;
      background-color: #4aff8c; border-radius: 50%;
      box-shadow: 0 0 6px #4aff8c; animation: pulse 2s infinite;
    }
    .coords-overlay {
      position: absolute; bottom: 1.5rem; left: 1.5rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
      color: #4a4a4a; line-height: 1.7; letter-spacing: 0.1em;
      z-index: 15; pointer-events: none; text-transform: uppercase;
    }
    .coords-overlay span { color: #8a8a8a; }
    .globe-label {
      position: absolute; top: 1.5rem; left: 1.5rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
      color: #555; letter-spacing: 0.2em; text-transform: uppercase;
      z-index: 15; pointer-events: none; display: flex;
      align-items: center; gap: 0.5rem;
    }
    .globe-label .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: #4aff8c; box-shadow: 0 0 8px #4aff8c;
      animation: pulse 2s infinite;
    }
    .scanlines {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px);
      pointer-events: none; z-index: 20; opacity: 0.25; mix-blend-mode: overlay;
    }
    @media (max-width: 1100px) { .search-section { width: 480px; max-width: 60vw; } }
    @media (max-width: 850px) {
      .app-container { flex-direction: column-reverse; }
      .search-section { width: 100%; max-width: 100%; height: 60vh; padding: 1rem; background: rgba(10,10,10,0.98); border-top: 1px solid rgba(255,255,255,0.1); }
      .globe-section { height: 40vh; flex: none; }
      .top-header .brand { font-size: 1.3rem; }
      .mode-tab { padding: 0.4rem 0.6rem; font-size: 0.55rem; }
      .mode-tab .tab-icon { display: none; }
      .coords-overlay, .globe-label { display: none; }
    }
    @media (max-width: 500px) {
      .top-header .meta-info { display: none; }
      .search-input-wrapper { flex-direction: column; }
      .search-input-wrapper button { padding: 0.7rem; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="globe-section">
      <div id="canvas-container"></div>
      <div class="globe-label"><span class="dot"></span> GLOBAL SURVEILLANCE GRID</div>
      <div class="coords-overlay">
        <div>LAT <span>37.7749° N</span></div>
        <div>LON <span>122.4194° W</span></div>
        <div>ALT <span>45.2 M</span></div>
      </div>
    </div>
    <div class="search-section">
      <div class="top-header">
        <div class="brand-block">
          <div class="brand">AGRO<span>OSINT</span></div>
          <div class="subtitle">MULTI-VECTOR IDENTITY RECON</div>
        </div>
        <div class="meta-info">
          <div><span class="label">NODE</span><span class="value">ALPHA-7</span></div>
          <div><span class="label">STATUS</span><span class="value" style="color:#4aff8c;">ACTIVE</span></div>
        </div>
      </div>
      <div class="mode-tabs" id="modeTabs">
        <button class="mode-tab active" data-mode="email"><span class="tab-icon">✉</span> EMAIL</button>
        <button class="mode-tab" data-mode="steam"><span class="tab-icon">◉</span> STEAM</button>
        <button class="mode-tab" data-mode="discord"><span class="tab-icon">◈</span> DISCORD</button>
      </div>
      <div class="search-area">
        <label id="inputLabel" for="searchInput">TARGET EMAIL ADDRESS</label>
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="name@example.com" autocomplete="off" spellcheck="false">
          <button id="scanBtn"><span>SCAN</span><span style="font-size:0.85rem;">↗</span></button>
        </div>
      </div>
      <div class="scan-status">
        <div class="status-text">
          <span class="dot done" id="statusDot"></span>
          <span id="statusLabel">READY</span>
        </div>
        <span id="scanCount">0 SOURCES</span>
      </div>
      <div class="results-container" id="resultsContainer">
        <div class="empty-state">
          <div class="icon">◈</div>
          <div>SELECT A VECTOR & ENTER TARGET</div>
          <div style="font-size:0.55rem; color:#444; margin-top:0.2rem;">STEAM · BREACH DATA · DISCORD</div>
        </div>
      </div>
      <div class="search-footer">
        <div class="status-group">
          <span><span class="dot"></span> UPLINK: SECURE</span>
          <span>AES-256</span>
        </div>
        <div>© 2025 AGRO OSINT</div>
      </div>
    </div>
  </div>
  <div class="scanlines"></div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

    // =============================================
    // 3D GLOBE (unchanged)
    // =============================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 1.5, 8);
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.05;
    controls.autoRotate = true; controls.autoRotateSpeed = 1.2;
    controls.enableZoom = true; controls.zoomSpeed = 0.8;
    controls.enablePan = false; controls.rotateSpeed = 0.8;
    controls.minDistance = 3; controls.maxDistance = 14;
    controls.target.set(0, 0, 0);
    scene.add(new THREE.AmbientLight(0x404060));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(1, 2, 1); scene.add(dirLight);
    const backLight = new THREE.PointLight(0x4466cc, 0.3);
    backLight.position.set(-2, -1, -3); scene.add(backLight);
    const group = new THREE.Group();
    const sphereGeo = new THREE.SphereGeometry(2.2, 36, 24);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.25 });
    group.add(new THREE.Mesh(sphereGeo, sphereMat));
    const particleCount = 1800;
    const particlesGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      const radius = 2.21 + (Math.random() - 0.5) * 0.15;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      positions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
      positions[i*3+2] = radius * Math.cos(phi);
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    group.add(new THREE.Points(particlesGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.025, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending })));
    const ringMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.2, transparent: true });
    const ring1Points = [];
    for (let i = 0; i <= 64; i++) { const angle = (i/64)*Math.PI*2; ring1Points.push(new THREE.Vector3(Math.cos(angle)*2.5, 0, Math.sin(angle)*2.5)); }
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ring1Points), ringMaterial));
    const ring2Points = [];
    for (let i = 0; i <= 64; i++) {
      const angle = (i/64)*Math.PI*2;
      const x = Math.cos(angle)*2.8, y = Math.sin(angle)*2.8*0.3, z = Math.sin(angle)*2.8*0.8;
      ring2Points.push(new THREE.Vector3(x, y*Math.cos(0.8)-z*Math.sin(0.8), y*Math.sin(0.8)+z*Math.cos(0.8)));
    }
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ring2Points), ringMaterial));
    const ring3Points = [];
    for (let i = 0; i <= 64; i++) { const angle = (i/64)*Math.PI*2; ring3Points.push(new THREE.Vector3(Math.cos(angle)*1.2, Math.sin(angle)*2.0, Math.cos(angle)*1.0)); }
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ring3Points), ringMaterial));
    const dotPositions = [[2.22,0,0],[-2.22,0,0],[0,2.22,0],[0,-2.22,0],[0,0,2.22],[0,0,-2.22]];
    const dotGeo = new THREE.BufferGeometry();
    dotGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(dotPositions.flat()), 3));
    group.add(new THREE.Points(dotGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, blending: THREE.AdditiveBlending })));
    const core = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, emissive: 0x88aaff }));
    group.add(core);
    scene.add(group);
    const starCount = 600;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPositions[i] = (Math.random() - 0.5) * 40;
      starPositions[i+1] = (Math.random() - 0.5) * 40;
      starPositions[i+2] = (Math.random() - 0.5) * 40;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending }));
    scene.add(stars);
    let clock = new THREE.Clock();
    function animate() {
      const elapsedTime = performance.now() * 0.001;
      group.rotation.y += 0.0005;
      group.rotation.x = Math.sin(elapsedTime * 0.1) * 0.05;
      group.rotation.z = Math.cos(elapsedTime * 0.15) * 0.03;
      controls.update();
      core.scale.setScalar(1 + Math.sin(elapsedTime * 8) * 0.15);
      stars.rotation.y += 0.0001;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
    function resizeGlobe() {
      const w = container.clientWidth, h = container.clientHeight;
      if (w > 0 && h > 0) { camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); }
    }
    window.addEventListener('resize', resizeGlobe);
    resizeGlobe();
    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

    // =============================================
    // REAL DATA SEARCH ENGINE
    // =============================================
    const searchInput = document.getElementById('searchInput');
    const scanBtn = document.getElementById('scanBtn');
    const resultsContainer = document.getElementById('resultsContainer');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const scanCount = document.getElementById('scanCount');
    const inputLabel = document.getElementById('inputLabel');
    const modeTabs = document.querySelectorAll('.mode-tab');

    let currentMode = 'email';

    // Your Cloudflare Worker URL (replace this)
    const WORKER_URL = 'https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev';

    const modes = {
      email: {
        label: 'TARGET EMAIL ADDRESS',
        placeholder: 'name@example.com',
        validate: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
        errorMsg: 'INVALID EMAIL FORMAT.'
      },
      steam: {
        label: 'STEAM ID / VANITY / PROFILE URL',
        placeholder: '76561198... or custom URL',
        validate: (v) => v.length >= 3,
        errorMsg: 'ENTER A VALID STEAM ID OR VANITY URL.'
      },
      discord: {
        label: 'DISCORD USER ID',
        placeholder: 'e.g. 123456789012345678',
        validate: (v) => /^\d{17,20}$/.test(v),
        errorMsg: 'DISCORD ID MUST BE 17-20 DIGITS.'
      }
    };

    modeTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        modeTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;
        const cfg = modes[currentMode];
        inputLabel.textContent = cfg.label;
        searchInput.placeholder = cfg.placeholder;
        searchInput.value = '';
        clearResults();
        searchInput.focus();
      });
    });

    function setStatus(state, label) {
      statusDot.className = 'dot ' + state;
      statusLabel.textContent = label;
    }
    function setScanCount(count) { scanCount.textContent = count + ' SOURCES'; }
    function clearResults() {
      resultsContainer.innerHTML = `<div class="empty-state"><div class="icon">◈</div><div>SELECT A VECTOR & ENTER TARGET</div><div style="font-size:0.55rem; color:#444; margin-top:0.2rem;">STEAM · BREACH DATA · DISCORD</div></div>`;
      setScanCount(0); setStatus('done', 'READY');
    }
    function showError(msg) {
      resultsContainer.innerHTML = `<div class="error-message">${msg}</div>`;
      setScanCount(0); setStatus('error', 'ERROR');
    }

    // --- REAL API CALLS VIA WORKER ---
    async function fetchSteamData(query) {
      const url = `${WORKER_URL}/steam?q=${encodeURIComponent(query)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Steam API error: ${res.status}`);
      return res.json();
    }

    async function fetchHudsonRock(email) {
      const url = `${WORKER_URL}/hudsonrock?email=${encodeURIComponent(email)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HudsonRock API error: ${res.status}`);
      return res.json();
    }

    async function fetchGravatar(email) {
      const url = `${WORKER_URL}/gravatar?email=${encodeURIComponent(email)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Gravatar API error: ${res.status}`);
      return res.json();
    }

    async function fetchDiscord(userId) {
      const url = `${WORKER_URL}/discord?id=${encodeURIComponent(userId)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Discord API error: ${res.status}`);
      return res.json();
    }

    // --- RENDER HELPERS ---
    function renderResult(sourceName, tagClass, text, confidence, date) {
      const el = document.createElement('div');
      el.className = 'result-item';
      el.innerHTML = `
        <div class="source">
          <span class="tag ${tagClass}">${tagClass.toUpperCase()}</span>
          <span>${sourceName}</span>
        </div>
        <div class="data">${text}</div>
        <div class="meta">
          <span>CONFIDENCE: ${confidence}%</span>
          <span>${date || 'LIVE'}</span>
        </div>
      `;
      resultsContainer.appendChild(el);
      resultsContainer.scrollTop = resultsContainer.scrollHeight;
    }

    // --- MAIN SCAN ---
    async function performScan(target) {
      const cfg = modes[currentMode];
      if (!cfg.validate(target)) { showError(cfg.errorMsg); return; }

      scanBtn.disabled = true;
      scanBtn.innerHTML = '<span class="spinner"></span> SCAN';
      setStatus('scanning', 'SCANNING');
      resultsContainer.innerHTML = '';
      setScanCount(0);

      try {
        let found = 0;

        if (currentMode === 'steam') {
          setStatus('scanning', 'FETCHING STEAM...');
          const data = await fetchSteamData(target);
          const players = data?.response?.players || data?.players || [];
          if (players.length > 0) {
            const p = players[0];
            renderResult('Steam Web API', 'steam',
              `Persona: <span class="highlight">${p.personaname || 'N/A'}</span>`, 95, 'LIVE');
            renderResult('Steam Web API', 'steam',
              `Profile URL: <span class="highlight">${p.profileurl || 'N/A'}</span>`, 95, 'LIVE');
            renderResult('Steam Web API', 'steam',
              `Status: <span class="highlight">${p.personastate || 'Offline'}</span>`, 90, 'LIVE');
            if (p.gameextrainfo) {
              renderResult('Steam Web API', 'gaming',
                `Currently playing: <span class="game-tag">${p.gameextrainfo}</span>`, 99, 'LIVE');
            }
            found = 4;
          } else {
            renderResult('Steam Web API', 'steam', 'No public profile data found for this ID.', 0, 'LIVE');
          }
        }

        if (currentMode === 'email') {
          // 1. HudsonRock (free, no key)
          setStatus('scanning', 'HUDSONROCK...');
          try {
            const hr = await fetchHudsonRock(target);
            if (hr && hr.stealers && hr.stealers.length > 0) {
              const s = hr.stealers[0];
              renderResult('HudsonRock Cavalier', 'breach',
                `Infostealer: <span class="highlight">${s.stealer_family || 'Unknown'}</span>`, 90, 'LIVE');
              renderResult('HudsonRock Cavalier', 'breach',
                `Computer: <span class="highlight">${s.computer_name || 'N/A'}</span> · OS: <span class="highlight">${s.os || 'N/A'}</span>`, 85, 'LIVE');
              if (s.top_logins && s.top_logins.length > 0) {
                renderResult('HudsonRock Cavalier', 'breach',
                  `Leaked logins: <span class="highlight">${s.top_logins.join(', ')}</span>`, 80, 'LIVE');
              }
              if (s.ip_address) {
                renderResult('HudsonRock Cavalier', 'breach',
                  `IP: <span class="highlight">${s.ip_address}</span>`, 75, 'LIVE');
              }
              found += 3;
            } else {
              renderResult('HudsonRock Cavalier', 'breach', 'No infostealer compromise found.', 0, 'LIVE');
            }
          } catch(e) { console.warn('HudsonRock failed:', e.message); }

          // 2. Gravatar (free, no key)
          setStatus('scanning', 'GRAVATAR...');
          try {
            const gv = await fetchGravatar(target);
            if (gv && gv.hash) {
              renderResult('Gravatar', 'social',
                `Display name: <span class="highlight">${gv.display_name || 'N/A'}</span>`, 95, 'LIVE');
              if (gv.location) renderResult('Gravatar', 'social', `Location: <span class="highlight">${gv.location}</span>`, 90, 'LIVE');
              if (gv.job_title) renderResult('Gravatar', 'social', `Job: <span class="highlight">${gv.job_title}</span>`, 85, 'LIVE');
              if (gv.company) renderResult('Gravatar', 'social', `Company: <span class="highlight">${gv.company}</span>`, 85, 'LIVE');
              if (gv.verified_accounts && gv.verified_accounts.length > 0) {
                renderResult('Gravatar', 'social',
                  `Verified: <span class="highlight">${gv.verified_accounts.map(a => a.service).join(', ')}</span>`, 90, 'LIVE');
              }
              found += 2;
            }
          } catch(e) { console.warn('Gravatar failed:', e.message); }

          // 3. HIBP (only if you add a paid key to Worker)
          setStatus('scanning', 'HIBP...');
          try {
            const hibp = await fetch(`${WORKER_URL}/hibp?email=${encodeURIComponent(target)}`);
            if (hibp.ok) {
              const data = await hibp.json();
              if (Array.isArray(data) && data.length > 0) {
                data.slice(0, 5).forEach(b => {
                  renderResult('HaveIBeenPwned', 'breach',
                    `Breach: <span class="highlight">${b.Name || b.Title}</span> (${b.PwnCount?.toLocaleString() || '?'} accounts)`, 95, 'LIVE');
                });
                found += data.length;
              }
            }
          } catch(e) { console.warn('HIBP skipped (needs paid key):', e.message); }
        }

        if (currentMode === 'discord') {
          setStatus('scanning', 'DISCORD...');
          try {
            const dc = await fetchDiscord(target);
            if (dc && dc.id) {
              renderResult('Discord API', 'discord',
                `Username: <span class="highlight">${dc.username || 'N/A'}</span>`, 99, 'LIVE');
              if (dc.global_name) renderResult('Discord API', 'discord', `Display name: <span class="highlight">${dc.global_name}</span>`, 99, 'LIVE');
              renderResult('Discord API', 'discord',
                `Avatar: <span class="highlight">${dc.avatar ? 'Yes' : 'Default'}</span>`, 90, 'LIVE');
              if (dc.banner) renderResult('Discord API', 'discord', `Banner: <span class="highlight">Present</span>`, 85, 'LIVE');
              found = 3;
            }
          } catch(e) {
            if (e.message.includes('401') || e.message.includes('403')) {
              showError('Discord lookup requires a bot token in the Worker. Add DISCORD_BOT_TOKEN secret.');
            } else {
              console.warn('Discord failed:', e.message);
            }
          }
        }

        setScanCount(found);
        setStatus('done', found > 0 ? 'COMPLETE' : 'CLEAN');
        if (found === 0) {
          resultsContainer.innerHTML = `<div class="empty-state"><div class="icon">✓</div><div>NO RESULTS FOUND</div><div style="font-size:0.55rem; color:#444; margin-top:0.2rem;">TARGET APPEARS CLEAN IN SCANNED SOURCES</div></div>`;
        }
      } catch (err) {
        showError('SCAN FAILED: ' + err.message);
        console.error(err);
      }

      scanBtn.disabled = false;
      scanBtn.innerHTML = '<span>SCAN</span><span style="font-size:0.85rem;">↗</span>';
    }

    scanBtn.addEventListener('click', () => {
      const v = searchInput.value.trim();
      if (!v) { showError('PLEASE ENTER A TARGET VALUE.'); return; }
      performScan(v);
    });
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); scanBtn.click(); }
    });
    window.addEventListener('load', () => setTimeout(() => searchInput.focus(), 500));
  </script>
</body>
</html>
