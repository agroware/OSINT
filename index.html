<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRO OSINT</title>
  <!-- Google Fonts for modern monospace / sans-serif -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden; /* prevent scroll for fullscreen 3d */
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* subtle white accents and texture */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.02) 0%, transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.02) 0%, transparent 40%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.01) 0px, rgba(255, 255, 255, 0.01) 1px, transparent 1px, transparent 8px);
      pointer-events: none;
      z-index: 0;
    }

    /* ----- UI OVERLAY (fixed, black with white accents) ----- */
    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none; /* allow mouse events to pass to canvas for 3D */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 2.5rem;
    }

    /* header section */
    .header {
      pointer-events: none; /* children can re-enable if needed */
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 300;
      font-size: 0.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 1rem;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .header-left .brand {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .header-left .brand span {
      color: #b0b0b0;
      font-weight: 300;
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      margin-left: 0.5rem;
    }

    .header-right {
      display: flex;
      gap: 2.5rem;
      font-size: 0.7rem;
      color: #a0a0a0;
      font-family: 'JetBrains Mono', monospace;
    }

    .header-right div {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .header-right .label {
      color: #666;
      margin-bottom: 0.2rem;
    }

    .header-right .value {
      color: #fff;
      font-weight: 400;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      padding-bottom: 0.1rem;
    }

    /* footer / status */
    .footer {
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #5a5a5a;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1rem;
      letter-spacing: 0.15em;
    }

    .footer .status {
      display: flex;
      gap: 2rem;
    }

    .footer .status span {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .footer .status .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: #4aff8c;
      border-radius: 50%;
      box-shadow: 0 0 8px #4aff8c;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; box-shadow: 0 0 4px #4aff8c; }
      50% { opacity: 1; box-shadow: 0 0 12px #4aff8c; }
      100% { opacity: 0.6; box-shadow: 0 0 4px #4aff8c; }
    }

    /* info panels – subtle white borders */
    .info-panel {
      pointer-events: none;
      position: absolute;
      bottom: 6rem;
      right: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      z-index: 15;
    }

    .info-panel .line {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .info-panel .line .key {
      color: #555;
    }

    .info-panel .line .val {
      color: #ddd;
      font-weight: 400;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
      padding-bottom: 0.1rem;
    }

    /* tiny coordinate overlay */
    .coords {
      pointer-events: none;
      position: absolute;
      bottom: 6rem;
      left: 2.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #4a4a4a;
      line-height: 1.6;
      letter-spacing: 0.1em;
      z-index: 15;
    }

    .coords span {
      color: #8a8a8a;
    }

    /* 3D canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* very subtle scanline effect */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.1) 0px,
        rgba(0, 0, 0, 0.1) 2px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 20;
      opacity: 0.3;
      mix-blend-mode: overlay;
    }

    /* Mobile adjustments */
    @media (max-width: 700px) {
      .ui-overlay {
        padding: 1.5rem;
      }
      .header-left .brand {
        font-size: 1.4rem;
      }
      .header-right {
        display: none;
      }
      .footer .status {
        flex-direction: column;
        gap: 0.3rem;
      }
      .info-panel {
        display: none;
      }
      .coords {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- 3D canvas will be injected here by three.js -->
  <div id="canvas-container"></div>

  <!-- UI overlay with white accents -->
  <div class="ui-overlay">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="brand">AGRO<span>OSINT</span></div>
        <div style="font-size: 0.6rem; letter-spacing: 0.3em; color: #666;">GEOSPATIAL INTELLIGENCE / v.2.4.1</div>
      </div>
      <div class="header-right">
        <div>
          <span class="label">NODE</span>
          <span class="value">ALPHA-7</span>
        </div>
        <div>
          <span class="label">LATENCY</span>
          <span class="value">12ms</span>
        </div>
        <div>
          <span class="label">STATUS</span>
          <span class="value" style="color:#4aff8c;">ACTIVE</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="status">
        <span><span class="dot"></span> UPLINK: SECURE</span>
        <span>ENCRYPTION: AES-256</span>
      </div>
      <div style="color: #3a3a3a;">© 2025 AGRO OSINT // ALL SIGNALS MONITORED</div>
    </div>
  </div>

  <!-- Additional floating info -->
  <div class="info-panel">
    <div class="line"><span class="key">TARGET</span> <span class="val">GLOBAL</span></div>
    <div class="line"><span class="key">SENSORS</span> <span class="val">12 ACTIVE</span></div>
    <div class="line"><span class="key">DATASTREAM</span> <span class="val">LIVE</span></div>
  </div>

  <div class="coords">
    <div>LAT <span>37.7749° N</span></div>
    <div>LON <span>122.4194° W</span></div>
    <div>ALT <span>45.2 M</span></div>
  </div>

  <!-- scanline overlay for mood -->
  <div class="scanlines"></div>

  <!-- Three.js from CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

    // --- setup scene ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a); // deep black

    // --- camera (perspective) ---
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 8);

    // --- renderer ---
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false; // not needed
    container.appendChild(renderer.domElement);

    // --- controls (mouse drag) ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;
    controls.enableZoom = true;
    controls.zoomSpeed = 0.8;
    controls.enablePan = false; // keep focus on the object
    controls.rotateSpeed = 0.8;
    controls.minDistance = 3;
    controls.maxDistance = 14;
    controls.target.set(0, 0, 0);

    // --- subtle lights ---
    const ambientLight = new THREE.AmbientLight(0x404060);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(1, 2, 1);
    scene.add(dirLight);

    const backLight = new THREE.PointLight(0x4466cc, 0.3);
    backLight.position.set(-2, -1, -3);
    scene.add(backLight);

    // --- 3D OBJECT: a wireframe globe with white accents ---
    const group = new THREE.Group();

    // 1. main wireframe sphere (white, thin lines)
    const sphereGeo = new THREE.SphereGeometry(2.2, 36, 24);
    const sphereMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      wireframe: true,
      transparent: true,
      opacity: 0.25
    });
    const wireframeSphere = new THREE.Mesh(sphereGeo, sphereMat);
    group.add(wireframeSphere);

    // 2. inner dotted sphere / particle system for subtle texture
    const particleCount = 1800;
    const particlesGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    
    for (let i = 0; i < particleCount; i++) {
      // spherical distribution with slight random radius variation
      const radius = 2.21 + (Math.random() - 0.5) * 0.15;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      
      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.sin(phi) * Math.sin(theta);
      const z = radius * Math.cos(phi);
      
      positions[i*3] = x;
      positions[i*3+1] = y;
      positions[i*3+2] = z;
    }
    
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particlesMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.025,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(particlesGeo, particlesMat);
    group.add(particles);

    // 3. rings / orbits (white, slight opacity)
    const ringMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.2, transparent: true });

    // ring 1 - equatorial
    const ring1Points = [];
    const ring1Radius = 2.5;
    for (let i = 0; i <= 64; i++) {
      const angle = (i / 64) * Math.PI * 2;
      ring1Points.push(new THREE.Vector3(Math.cos(angle) * ring1Radius, 0, Math.sin(angle) * ring1Radius));
    }
    const ring1Geo = new THREE.BufferGeometry().setFromPoints(ring1Points);
    const ring1 = new THREE.Line(ring1Geo, ringMaterial);
    group.add(ring1);

    // ring 2 - tilted
    const ring2Points = [];
    const ring2Radius = 2.8;
    for (let i = 0; i <= 64; i++) {
      const angle = (i / 64) * Math.PI * 2;
      const x = Math.cos(angle) * ring2Radius;
      const y = Math.sin(angle) * ring2Radius * 0.3; // flatten
      const z = Math.sin(angle) * ring2Radius * 0.8;
      // rotate around x axis
      const rotatedY = y * Math.cos(0.8) - z * Math.sin(0.8);
      const rotatedZ = y * Math.sin(0.8) + z * Math.cos(0.8);
      ring2Points.push(new THREE.Vector3(x, rotatedY, rotatedZ));
    }
    const ring2Geo = new THREE.BufferGeometry().setFromPoints(ring2Points);
    const ring2 = new THREE.Line(ring2Geo, ringMaterial);
    group.add(ring2);

    // ring 3 - another tilt
    const ring3Points = [];
    const ring3Radius = 2.0;
    for (let i = 0; i <= 64; i++) {
      const angle = (i / 64) * Math.PI * 2;
      const x = Math.cos(angle) * ring3Radius * 0.6;
      const y = Math.sin(angle) * ring3Radius;
      const z = Math.cos(angle) * ring3Radius * 0.5;
      ring3Points.push(new THREE.Vector3(x, y, z));
    }
    const ring3Geo = new THREE.BufferGeometry().setFromPoints(ring3Points);
    const ring3 = new THREE.Line(ring3Geo, ringMaterial);
    group.add(ring3);

    // 4. small glowing dots at cardinal points on the main sphere
    const dotMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, blending: THREE.AdditiveBlending });
    const dotPositions = [
      [2.22, 0, 0], [-2.22, 0, 0], [0, 2.22, 0], [0, -2.22, 0], [0, 0, 2.22], [0, 0, -2.22]
    ];
    const dotGeo = new THREE.BufferGeometry();
    const dotArray = new Float32Array(dotPositions.flat());
    dotGeo.setAttribute('position', new THREE.BufferAttribute(dotArray, 3));
    const dots = new THREE.Points(dotGeo, dotMaterial);
    group.add(dots);

    // 5. a central glowing core (tiny sphere)
    const coreGeo = new THREE.SphereGeometry(0.08, 16, 16);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, emissive: 0x88aaff });
    const core = new THREE.Mesh(coreGeo, coreMat);
    group.add(core);

    scene.add(group);

    // --- additional floating white particles around the scene (very subtle) ---
    const starCount = 600;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      // spread in a larger volume
      starPositions[i] = (Math.random() - 0.5) * 40;
      starPositions[i+1] = (Math.random() - 0.5) * 40;
      starPositions[i+2] = (Math.random() - 0.5) * 40;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // --- animation loop ---
    let clock = new THREE.Clock();

    function animate() {
      const delta = clock.getDelta();
      const elapsedTime = performance.now() * 0.001; // seconds

      // subtle rotation of the entire group (in addition to autoRotate)
      group.rotation.y += 0.0005;
      group.rotation.x = Math.sin(elapsedTime * 0.1) * 0.05;
      group.rotation.z = Math.cos(elapsedTime * 0.15) * 0.03;

      // update controls (auto-rotate enabled)
      controls.update();

      // slight pulsating of the core
      core.scale.setScalar(1 + Math.sin(elapsedTime * 8) * 0.15);

      // rotate stars very slowly
      stars.rotation.y += 0.0001;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // --- resize handler ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- disable right-click context menu on canvas for cleaner look (optional) ---
    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
