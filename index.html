<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRO OSINT // MULTI-VECTOR RECON</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0a0a0a; color: #e0e0e0;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden; height: 100vh; width: 100vw; position: relative;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.02) 0%, transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.02) 0%, transparent 40%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 8px);
      pointer-events: none; z-index: 0;
    }
    .app-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; z-index: 5; pointer-events: none;
    }
    .globe-section { flex: 1; position: relative; pointer-events: auto; min-width: 0; }
    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1; cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }
    .search-section {
      width: 580px; max-width: 55vw; height: 100%; position: relative;
      pointer-events: auto; display: flex; flex-direction: column; z-index: 50;
      padding: 2rem 2rem 2rem 0;
      background: linear-gradient(90deg, transparent 0%, rgba(10,10,10,0.6) 15%, rgba(10,10,10,0.95) 100%);
      overflow: hidden;
    }
    .top-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      width: 100%; padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.15); margin-bottom: 1.2rem;
    }
    .top-header .brand-block { display: flex; flex-direction: column; gap: 0.3rem; }
    .top-header .brand {
      font-size: 1.8rem; font-weight: 600; letter-spacing: 0.35em; line-height: 1;
      color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.3); text-transform: uppercase;
    }
    .top-header .brand span { color: #b0b0b0; font-weight: 300; font-size: 1rem; letter-spacing: 0.2em; margin-left: 0.4rem; }
    .top-header .subtitle { font-size: 0.55rem; letter-spacing: 0.3em; color: #666; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; }
    .top-header .meta-info { display: flex; gap: 1.5rem; font-size: 0.6rem; color: #888; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; }
    .top-header .meta-info div { display: flex; flex-direction: column; align-items: flex-end; }
    .top-header .meta-info .label { color: #555; font-size: 0.5rem; margin-bottom: 0.15rem; }
    .top-header .meta-info .value { color: #ddd; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 0.1rem; }
    .mode-tabs { display: flex; gap: 0.3rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .mode-tab {
      background: rgba(20,20,20,0.8); border: 1px solid rgba(255,255,255,0.1);
      color: #888; padding: 0.5rem 0.8rem; font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; transition: all 0.2s;
      display: flex; align-items: center; gap: 0.35rem; white-space: nowrap;
    }
    .mode-tab .tab-icon { font-size: 0.85rem; opacity: 0.7; }
    .mode-tab:hover { background: rgba(40,40,40,0.9); border-color: rgba(255,255,255,0.25); color: #ccc; }
    .mode-tab.active { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.5); color: #fff; box-shadow: 0 0 12px rgba(255,255,255,0.1); }
    .mode-tab.active .tab-icon { opacity: 1; }
    .search-area { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1rem; }
    .search-area label { font-size: 0.6rem; letter-spacing: 0.15em; color: #777; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
    .search-input-wrapper { display: flex; gap: 0.5rem; }
    .search-input-wrapper input {
      flex: 1; background: rgba(15,15,15,0.9); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; padding: 0.8rem 0.9rem; font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem; outline: none; border-radius: 2px; transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.02em;
    }
    .search-input-wrapper input:focus { border-color: rgba(255,255,255,0.5); background: rgba(25,25,25,0.95); }
    .search-input-wrapper input::placeholder { color: #4a4a4a; font-size: 0.75rem; }
    .search-input-wrapper button {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 0 1.3rem; font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem; letter-spacing: 0.1em; cursor: pointer;
      border-radius: 2px; transition: all 0.2s; display: flex; align-items: center;
      gap: 0.4rem; white-space: nowrap; text-transform: uppercase;
    }
    .search-input-wrapper button:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
    .search-input-wrapper button:active { background: rgba(255,255,255,0.3); transform: scale(0.97); }
    .search-input-wrapper button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .scan-status {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.6rem; color: #777; padding: 0.4rem 0;
      border-bottom: 1px dashed rgba(255,255,255,0.08);
      border-top: 1px dashed rgba(255,255,255,0.08);
      margin-bottom: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .scan-status .status-text { display: flex; align-items: center; gap: 0.4rem; }
    .scan-status .status-text .dot {
      width: 5px; height: 5px; border-radius: 50%; background: #4aff8c;
      box-shadow: 0 0 6px #4aff8c; animation: pulse 2s infinite;
    }
    .scan-status .status-text .dot.scanning { background: #ffaa33; box-shadow: 0 0 6px #ffaa33; animation: pulse 1s infinite; }
    .scan-status .status-text .dot.error { background: #ff4a4a; box-shadow: 0 0 6px #ff4a4a; animation: none; }
    .scan-status .status-text .dot.done { background: #4aff8c; box-shadow: 0 0 6px #4aff8c; animation: none; }
    @keyframes pulse {
      0% { opacity: 0.6; box-shadow: 0 0 4px currentColor; }
      50% { opacity: 1; box-shadow: 0 0 12px currentColor; }
      100% { opacity: 0.6; box-shadow: 0 0 4px currentColor; }
    }
    .results-container {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
      gap: 0.6rem; padding-right: 0.4rem; scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent; min-height: 0;
    }
    .results-container::-webkit-scrollbar { width: 4px; }
    .results-container::-webkit-scrollbar-track { background: transparent; }
    .results-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 2.5rem 0.5rem; color: #555;
      font-size: 0.65rem; text-align: center; gap: 0.6rem;
      letter-spacing: 0.05em; font-family: 'JetBrains Mono', monospace;
    }
    .empty-state .icon { font-size: 2rem; opacity: 0.25; }
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 1.5px solid rgba(255,255,255,0.2); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .error-message {
      background: rgba(255,80,80,0.1); border-left: 2px solid #ff4a4a;
      color: #ff8a8a; padding: 0.6rem 0.9rem; font-size: 0.65rem;
      border-radius: 1px; animation: fadeIn 0.2s ease;
      font-family: 'JetBrains Mono', monospace;
    }
    .search-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 0.8rem; margin-top: 0.5rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-family: 'JetBrains Mono', monospace; font-size: 0.55rem;
      color: #444; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .search-footer .status-group { display: flex; gap: 1.2rem; align-items: center; }
    .search-footer .status-group span { display: flex; align-items: center; gap: 0.35rem; }
    .search-footer .status-group .dot {
      display: inline-block; width: 5px; height: 5px;
      background-color: #4aff8c; border-radius: 50%;
      box-shadow: 0 0 6px #4aff8c; animation: pulse 2s infinite;
    }
    .coords-overlay {
      position: absolute; bottom: 1.5rem; left: 1.5rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
      color: #4a4a4a; line-height: 1.7; letter-spacing: 0.1em;
      z-index: 15; pointer-events: none; text-transform: uppercase;
    }
    .coords-overlay span { color: #8a8a8a; }
    .globe-label {
      position: absolute; top: 1.5rem; left: 1.5rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
      color: #555; letter-spacing: 0.2em; text-transform: uppercase;
      z-index: 15; pointer-events: none; display: flex;
      align-items: center; gap: 0.5rem;
    }
    .globe-label .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: #4aff8c; box-shadow: 0 0 8px #4aff8c;
      animation: pulse 2s infinite;
    }
    .scanlines {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px);
      pointer-events: none; z-index: 20; opacity: 0.25; mix-blend-mode: overlay;
    }

    /* ============================================= */
    /* TREE / BRANCH NODE STYLES                     */
    /* ============================================= */
    .tree-root {
      display: flex; flex-direction: column; gap: 0;
      font-family: 'JetBrains Mono', monospace;
    }

    .tree-node {
      position: relative;
      padding-left: 1.4rem;
      margin-bottom: 0.4rem;
    }

    .tree-node.level-0 { padding-left: 0; }

    /* vertical connector line */
    .tree-node.level-1::before,
    .tree-node.level-2::before {
      content: "";
      position: absolute;
      left: 0.5rem;
      top: -0.4rem;
      bottom: 50%;
      width: 1px;
      background: rgba(255,255,255,0.2);
    }
    .tree-node.level-2::before {
      background: rgba(255,255,255,0.12);
    }

    /* horizontal connector */
    .tree-node.level-1::after,
    .tree-node.level-2::after {
      content: "";
      position: absolute;
      left: 0.5rem;
      top: 50%;
      width: 0.8rem;
      height: 1px;
      background: rgba(255,255,255,0.2);
    }
    .tree-node.level-2::after {
      background: rgba(255,255,255,0.12);
    }

    .node-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-left: 2px solid rgba(255,255,255,0.3);
      border-radius: 2px;
      padding: 0.55rem 0.75rem;
      font-size: 0.68rem;
      line-height: 1.5;
      transition: background 0.2s, border-color 0.2s;
      animation: fadeIn 0.25s ease;
    }
    .node-card:hover {
      background: rgba(255,255,255,0.06);
      border-left-color: rgba(255,255,255,0.6);
    }

    /* level accent colors */
    .tree-node.level-0 .node-card {
      border-left-color: #ffffff;
      background: rgba(255,255,255,0.06);
    }
    .tree-node.level-1 .node-card {
      border-left-color: #66c0f4;
    }
    .tree-node.level-2 .node-card {
      border-left-color: #c48aff;
      background: rgba(180,60,255,0.04);
      border-color: rgba(180,60,255,0.15);
    }

    .node-header {
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 0.35rem;
      flex-wrap: wrap;
    }
    .node-tag {
      background: rgba(255,255,255,0.1);
      padding: 0.1rem 0.45rem;
      border-radius: 1px;
      font-size: 0.52rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.08);
      color: #ccc;
    }
    .node-tag.email   { background: rgba(100,200,100,0.12); border-color: rgba(100,200,100,0.3); color: #8aff8a; }
    .node-tag.phone   { background: rgba(255,200,60,0.12);  border-color: rgba(255,200,60,0.3);  color: #ffd66b; }
    .node-tag.steam   { background: rgba(23,105,170,0.15);  border-color: rgba(23,105,170,0.4);  color: #66c0f4; }
    .node-tag.discord { background: rgba(88,101,242,0.15);  border-color: rgba(88,101,242,0.4);  color: #7289da; }
    .node-tag.breach  { background: rgba(255,60,60,0.15);   border-color: rgba(255,60,60,0.4);   color: #ff6b6b; }
    .node-tag.social  { background: rgba(255,100,100,0.12); border-color: rgba(255,100,100,0.3); color: #ff8a8a; }

    .node-label {
      font-size: 0.62rem;
      color: #aaa;
      letter-spacing: 0.05em;
    }

    .node-data {
      color: #e0e0e0;
      font-size: 0.68rem;
      word-break: break-word;
    }
    .node-data .highlight {
      color: #fff;
      background: rgba(255,255,255,0.1);
      padding: 0 0.2rem;
      border-radius: 1px;
    }

    .node-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.52rem;
      color: #555;
      margin-top: 0.3rem;
      letter-spacing: 0.05em;
    }

    /* branch toggle button */
    .branch-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #ccc;
      padding: 0.25rem 0.6rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 1px;
      cursor: pointer;
      margin-top: 0.45rem;
      transition: all 0.2s;
    }
    .branch-toggle:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.4);
      color: #fff;
    }
    .branch-toggle.expanded {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.35);
      color: #fff;
    }
    .branch-toggle .arrow {
      display: inline-block;
      transition: transform 0.2s;
      font-size: 0.7rem;
    }
    .branch-toggle.expanded .arrow {
      transform: rotate(90deg);
    }

    .branch-children {
      margin-top: 0.4rem;
      margin-left: 0.2rem;
      animation: fadeIn 0.25s ease;
    }

    .max-depth-label {
      font-size: 0.5rem;
      color: #444;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.2rem 0 0 0.5rem;
      border-left: 1px dashed rgba(255,255,255,0.08);
      margin-left: 0.5rem;
    }

    @media (max-width: 1100px) { .search-section { width: 480px; max-width: 60vw; } }
    @media (max-width: 850px) {
      .app-container { flex-direction: column-reverse; }
      .search-section { width: 100%; max-width: 100%; height: 60vh; padding: 1rem; background: rgba(10,10,10,0.98); border-top: 1px solid rgba(255,255,255,0.1); }
      .globe-section { height: 40vh; flex: none; }
      .top-header .brand { font-size: 1.3rem; }
      .mode-tab { padding: 0.4rem 0.6rem; font-size: 0.55rem; }
      .mode-tab .tab-icon { display: none; }
      .coords-overlay, .globe-label { display: none; }
    }
    @media (max-width: 500px) {
      .top-header .meta-info { display: none; }
      .search-input-wrapper { flex-direction: column; }
      .search-input-wrapper button { padding: 0.7rem; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="globe-section">
      <div id="canvas-container"></div>
      <div class="globe-label"><span class="dot"></span> GLOBAL SURVEILLANCE GRID</div>
      <div class="coords-overlay">
        <div>LAT <span>37.7749° N</span></div>
        <div>LON <span>122.4194° W</span></div>
        <div>ALT <span>45.2 M</span></div>
      </div>
    </div>
    <div class="search-section">
      <div class="top-header">
        <div class="brand-block">
          <div class="brand">AGRO<span>OSINT</span></div>
          <div class="subtitle">MULTI-VECTOR IDENTITY RECON</div>
        </div>
        <div class="meta-info">
          <div><span class="label">NODE</span><span class="value">ALPHA-7</span></div>
          <div><span class="label">STATUS</span><span class="value" style="color:#4aff8c;">ACTIVE</span></div>
        </div>
      </div>
      <div class="mode-tabs" id="modeTabs">
        <button class="mode-tab active" data-mode="email"><span class="tab-icon">✉</span> EMAIL</button>
        <button class="mode-tab" data-mode="steam"><span class="tab-icon">◉</span> STEAM</button>
        <button class="mode-tab" data-mode="discord"><span class="tab-icon">◈</span> DISCORD</button>
      </div>
      <div class="search-area">
        <label id="inputLabel" for="searchInput">TARGET EMAIL ADDRESS</label>
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="name@example.com" autocomplete="off" spellcheck="false">
          <button id="scanBtn"><span>SCAN</span><span style="font-size:0.85rem;">↗</span></button>
        </div>
      </div>
      <div class="scan-status">
        <div class="status-text">
          <span class="dot done" id="statusDot"></span>
          <span id="statusLabel">READY</span>
        </div>
        <span id="scanCount">0 NODES</span>
      </div>
      <div class="results-container" id="resultsContainer">
        <div class="empty-state">
          <div class="icon">◈</div>
          <div>SELECT A VECTOR & ENTER TARGET</div>
          <div style="font-size:0.55rem; color:#444; margin-top:0.2rem;">TREE BRANCH VISUALIZATION · 2 LEVELS DEEP</div>
        </div>
      </div>
      <div class="search-footer">
        <div class="status-group">
          <span><span class="dot"></span> UPLINK: SECURE</span>
          <span>AES-256</span>
        </div>
        <div>© 2025 AGRO OSINT</div>
      </div>
    </div>
  </div>
  <div class="scanlines"></div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

    // =============================================
    // 3D GLOBE (with contour outlines)
    // =============================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 1.5, 8);
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.05;
    controls.autoRotate = true; controls.autoRotateSpeed = 1.2;
    controls.enableZoom = true; controls.zoomSpeed = 0.8;
    controls.enablePan = false; controls.rotateSpeed = 0.8;
    controls.minDistance = 3; controls.maxDistance = 14;
    controls.target.set(0, 0, 0);
    scene.add(new THREE.AmbientLight(0x404060));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(1, 2, 1); scene.add(dirLight);
    const backLight = new THREE.PointLight(0x4466cc, 0.3);
    backLight.position.set(-2, -1, -3); scene.add(backLight);

    const group = new THREE.Group();

    const sphereGeo = new THREE.SphereGeometry(2.2, 36, 24);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.22 });
    group.add(new THREE.Mesh(sphereGeo, sphereMat));

    const contourGeo = new THREE.SphereGeometry(2.205, 24, 48);
    const contourMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, wireframe: true, transparent: true, opacity: 0.08
    });
    group.add(new THREE.Mesh(contourGeo, contourMat));

    const latRingMat = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.15, transparent: true });
    for (let lat = -75; lat <= 75; lat += 15) {
      const phi = (90 - lat) * Math.PI / 180;
      const radius = 2.21 * Math.sin(phi);
      const y = 2.21 * Math.cos(phi);
      const points = [];
      for (let i = 0; i <= 48; i++) {
        const theta = (i / 48) * Math.PI * 2;
        points.push(new THREE.Vector3(radius * Math.cos(theta), y, radius * Math.sin(theta)));
      }
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), latRingMat));
    }

    const particleCount = 1800;
    const particlesGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      const radius = 2.21 + (Math.random() - 0.5) * 0.15;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      positions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
      positions[i*3+2] = radius * Math.cos(phi);
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    group.add(new THREE.Points(particlesGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.025, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending })));

    const ringMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.2, transparent: true });
    const ring1Points = [];
    for (let i = 0; i <= 64; i++) { const angle = (i/64)*Math.PI*2; ring1Points.push(new THREE.Vector3(Math.cos(angle)*2.5, 0, Math.sin(angle)*2.5)); }
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ring1Points), ringMaterial));
    const ring2Points = [];
    for (let i = 0; i <= 64; i++) {
      const angle = (i/64)*Math.PI*2;
      const x = Math.cos(angle)*2.8, y = Math.sin(angle)*2.8*0.3, z = Math.sin(angle)*2.8*0.8;
      ring2Points.push(new THREE.Vector3(x, y*Math.cos(0.8)-z*Math.sin(0.8), y*Math.sin(0.8)+z*Math.cos(0.8)));
    }
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ring2Points), ringMaterial));
    const ring3Points = [];
    for (let i = 0; i <= 64; i++) { const angle = (i/64)*Math.PI*2; ring3Points.push(new THREE.Vector3(Math.cos(angle)*1.2, Math.sin(angle)*2.0, Math.cos(angle)*1.0)); }
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ring3Points), ringMaterial));

    const dotPositions = [[2.22,0,0],[-2.22,0,0],[0,2.22,0],[0,-2.22,0],[0,0,2.22],[0,0,-2.22]];
    const dotGeo = new THREE.BufferGeometry();
    dotGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(dotPositions.flat()), 3));
    group.add(new THREE.Points(dotGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, blending: THREE.AdditiveBlending })));

    const core = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, emissive: 0x88aaff }));
    group.add(core);

    scene.add(group);

    const starCount = 600;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPositions[i] = (Math.random() - 0.5) * 40;
      starPositions[i+1] = (Math.random() - 0.5) * 40;
      starPositions[i+2] = (Math.random() - 0.5) * 40;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending }));
    scene.add(stars);

    function animate() {
      const t = performance.now() * 0.001;
      group.rotation.y += 0.0005;
      group.rotation.x = Math.sin(t * 0.1) * 0.05;
      group.rotation.z = Math.cos(t * 0.15) * 0.03;
      controls.update();
      core.scale.setScalar(1 + Math.sin(t * 8) * 0.15);
      stars.rotation.y += 0.0001;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    function resizeGlobe() {
      const w = container.clientWidth, h = container.clientHeight;
      if (w > 0 && h > 0) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
    }
    window.addEventListener('resize', resizeGlobe);
    resizeGlobe();
    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

    // =============================================
    // FAKE DATA TREE ENGINE
    // =============================================
    const searchInput = document.getElementById('searchInput');
    const scanBtn = document.getElementById('scanBtn');
    const resultsContainer = document.getElementById('resultsContainer');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const scanCount = document.getElementById('scanCount');
    const inputLabel = document.getElementById('inputLabel');
    const modeTabs = document.querySelectorAll('.mode-tab');

    let currentMode = 'email';
    let nodeCounter = 0;

    const modes = {
      email: {
        label: 'TARGET EMAIL ADDRESS',
        placeholder: 'name@example.com',
        validate: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
        errorMsg: 'INVALID EMAIL FORMAT.'
      },
      steam: {
        label: 'STEAM ID / VANITY',
        placeholder: '76561198... or custom URL',
        validate: (v) => v.length >= 3,
        errorMsg: 'ENTER A VALID STEAM ID OR VANITY URL.'
      },
      discord: {
        label: 'DISCORD USER ID',
        placeholder: 'e.g. 123456789012345678',
        validate: (v) => /^\d{17,20}$/.test(v),
        errorMsg: 'DISCORD ID MUST BE 17-20 DIGITS.'
      }
    };

    modeTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        modeTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;
        const cfg = modes[currentMode];
        inputLabel.textContent = cfg.label;
        searchInput.placeholder = cfg.placeholder;
        searchInput.value = '';
        clearResults();
        searchInput.focus();
      });
    });

    function setStatus(state, label) {
      statusDot.className = 'dot ' + state;
      statusLabel.textContent = label;
    }
    function setNodeCount(count) { scanCount.textContent = count + ' NODES'; }
    function clearResults() {
      resultsContainer.innerHTML = `<div class="empty-state"><div class="icon">◈</div><div>SELECT A VECTOR & ENTER TARGET</div><div style="font-size:0.55rem; color:#444; margin-top:0.2rem;">TREE BRANCH VISUALIZATION · 2 LEVELS DEEP</div></div>`;
      setNodeCount(0); setStatus('done', 'READY');
      nodeCounter = 0;
    }
    function showError(msg) {
      resultsContainer.innerHTML = `<div class="error-message">${msg}</div>`;
      setNodeCount(0); setStatus('error', 'ERROR');
    }

    // --- Random fake data generators ---
    const firstNames = ['John','Jane','Alex','Sam','Chris','Jordan','Taylor','Morgan','Casey','Riley','Avery','Quinn','Dakota','Skyler','Reese'];
    const lastNames  = ['Smith','Doe','Johnson','Brown','Lee','Garcia','Miller','Davis','Wilson','Moore','Taylor','Anderson','Thomas','Jackson','White'];
    const cities     = ['New York','London','Tokyo','Berlin','Toronto','Sydney','Paris','Amsterdam','Seoul','Austin'];
    const carriers   = ['Verizon','AT&T','T-Mobile','Vodafone','Orange','EE','O2','Three'];
    const games      = ['Counter-Strike 2','Valorant','League of Legends','Dota 2','Fortnite','Apex Legends','Rainbow Six Siege','Rust','Escape from Tarkov'];
    const ranks      = ['Bronze','Silver','Gold','Platinum','Diamond','Master','Grandmaster','Immortal','Radiant'];
    const regions    = ['NA','EU','ASIA','SA','OCE','ME'];
    const breachNames= ['Collection #1','AntiPublic','Exploit.in','Adobe','Dropbox','MyFitnessPal','LinkedIn Scrape','Zynga'];
    const servers    = ['Gaming Hub','ESports Central','Chill Zone','Competitive Arena','Speedrun Society','Trade Post'];
    const discordTags= ['Nitro','Early Supporter','HypeSquad','Bug Hunter','Verified Bot'];

    function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function fakePhone() {
      return `+1 (${randInt(200,999)}) ${randInt(200,999)}-${randInt(1000,9999)}`;
    }
    function fakeSteamId() {
      return '7656119' + String(randInt(100000000, 999999999));
    }
    function fakeDiscordId() {
      return String(randInt(100000000000000000, 999999999999999999));
    }
    function fakeEmail() {
      return `${rand(firstNames).toLowerCase()}.${rand(lastNames).toLowerCase()}${randInt(1,99)}@${rand(['gmail.com','outlook.com','protonmail.com','yahoo.com'])}`;
    }
    function fakeFullName() { return `${rand(firstNames)} ${rand(lastNames)}`; }

    // --- Node factories for each level ---
    function makeRootNode(mode, value) {
      const tagMap = { email: 'email', steam: 'steam', discord: 'discord' };
      let dataHtml = '';
      let label = '';

      if (mode === 'email') {
        label = 'Email Target';
        dataHtml = `<span class="highlight">${value}</span>`;
      } else if (mode === 'steam') {
        label = 'Steam Target';
        dataHtml = `SteamID: <span class="highlight">${value}</span>`;
      } else {
        label = 'Discord Target';
        dataHtml = `Discord ID: <span class="highlight">${value}</span>`;
      }

      return {
        id: ++nodeCounter,
        level: 0,
        tag: tagMap[mode],
        label: label,
        data: dataHtml,
        confidence: 100,
        children: [],
        hasChildren: true
      };
    }

    function generateLevel1(parentNode, mode, value) {
      // Level 1 is a mixed bag of things connected to the root
      const children = [];
      const pool = [];

      // Always include a phone number
      pool.push({
        tag: 'phone',
        label: 'Phone Number',
        data: `<span class="highlight">${fakePhone()}</span> · ${rand(carriers)}`,
        confidence: randInt(70, 95),
        kind: 'phone'
      });

      // Add a secondary email if root is not email
      if (mode !== 'email') {
        pool.push({
          tag: 'email',
          label: 'Linked Email',
          data: `<span class="highlight">${fakeEmail()}</span>`,
          confidence: randInt(65, 90),
          kind: 'email'
        });
      }

      // Add a Discord ID
      pool.push({
        tag: 'discord',
        label: 'Discord Account',
        data: `ID: <span class="highlight">${fakeDiscordId()}</span> · Tag: ${rand(discordTags)}`,
        confidence: randInt(70, 92),
        kind: 'discord'
      });

      // Add breach data
      pool.push({
        tag: 'breach',
        label: 'Breach Record',
        data: `Found in <span class="highlight">${rand(breachNames)}</span> · ${randInt(1, 50)} records`,
        confidence: randInt(60, 88),
        kind: 'breach'
      });

      // Add a social handle
      pool.push({
        tag: 'social',
        label: 'Social Handle',
        data: `@${rand(firstNames).toLowerCase()}${randInt(10,999)} on ${rand(['Twitter/X','Instagram','Reddit','GitHub'])}`,
        confidence: randInt(55, 85),
        kind: 'social'
      });

      // Pick 2-3 random children
      const count = randInt(2, 3);
      const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, count);

      shuffled.forEach(item => {
        children.push({
          id: ++nodeCounter,
          level: 1,
          tag: item.tag,
          label: item.label,
          data: item.data,
          confidence: item.confidence,
          parentKind: item.kind,
          children: [],
          hasChildren: true // can expand one more time
        });
      });

      return children;
    }

    function generateLevel2(parentNode) {
      // Level 2: things connected to the level-1 node. Hard stop after this.
      const children = [];
      const kind = parentNode.parentKind;

      if (kind === 'phone') {
        children.push({
          id: ++nodeCounter, level: 2, tag: 'steam', label: 'Steam Account',
          data: `SteamID: <span class="highlight">${fakeSteamId()}</span> · ${rand(regions)}`,
          confidence: randInt(60, 85), children: [], hasChildren: false
        });
        children.push({
          id: ++nodeCounter, level: 2, tag: 'social', label: 'Carrier Lookup',
          data: `Registered to <span class="highlight">${fakeFullName()}</span> · ${rand(cities)}`,
          confidence: randInt(55, 80), children: [], hasChildren: false
        });
      } else if (kind === 'discord') {
        children.push({
          id: ++nodeCounter, level: 2, tag: 'steam', label: 'Steam Linked',
          data: `SteamID: <span class="highlight">${fakeSteamId()}</span>`,
          confidence: randInt(60, 85), children: [], hasChildren: false
        });
        children.push({
          id: ++nodeCounter, level: 2, tag: 'gaming' in {} ? 'gaming' : 'social', label: 'Game Activity',
          data: `Playing <span class="highlight">${rand(games)}</span> · Rank ${rand(ranks)}`,
          confidence: randInt(55, 80), children: [], hasChildren: false
        });
      } else if (kind === 'email') {
        children.push({
          id: ++nodeCounter, level: 2, tag: 'breach', label: 'Password Leak',
          data: `Hash prefix: <span class="highlight">${Math.random().toString(36).substring(2,12)}</span>`,
          confidence: randInt(60, 85), children: [], hasChildren: false
        });
      } else if (kind === 'breach') {
        children.push({
          id: ++nodeCounter, level: 2, tag: 'email', label: 'Recovery Email',
          data: `<span class="highlight">${fakeEmail()}</span>`,
          confidence: randInt(55, 80), children: [], hasChildren: false
        });
      } else if (kind === 'social') {
        children.push({
          id: ++nodeCounter, level: 2, tag: 'steam', label: 'Gaming Profile',
          data: `SteamID: <span class="highlight">${fakeSteamId()}</span> · ${rand(games)}`,
          confidence: randInt(55, 80), children: [], hasChildren: false
        });
      } else {
        children.push({
          id: ++nodeCounter, level: 2, tag: 'social', label: 'Cross-Reference',
          data: `Linked to <span class="highlight">${fakeFullName()}</span>`,
          confidence: randInt(50, 75), children: [], hasChildren: false
        });
      }

      return children;
    }

    // --- Render tree ---
    function renderTree(root) {
      resultsContainer.innerHTML = '';
      const tree = document.createElement('div');
      tree.className = 'tree-root';
      tree.appendChild(renderNode(root));
      resultsContainer.appendChild(tree);
      setNodeCount(nodeCounter);
    }

    function renderNode(node) {
      const nodeEl = document.createElement('div');
      nodeEl.className = `tree-node level-${node.level}`;

      const card = document.createElement('div');
      card.className = 'node-card';

      const header = document.createElement('div');
      header.className = 'node-header';
      header.innerHTML = `
        <span class="node-tag ${node.tag}">${node.tag}</span>
        <span class="node-label">${node.label}</span>
      `;

      const data = document.createElement('div');
      data.className = 'node-data';
      data.innerHTML = node.data;

      const meta = document.createElement('div');
      meta.className = 'node-meta';
      meta.innerHTML = `
        <span>CONFIDENCE: ${node.confidence}%</span>
        <span>NODE #${node.id}</span>
      `;

      card.appendChild(header);
      card.appendChild(data);
      card.appendChild(meta);

      // Branch toggle button
      if (node.hasChildren && node.level < 2) {
        const btn = document.createElement('button');
        btn.className = 'branch-toggle';
        btn.innerHTML = `<span class="arrow">▶</span> EXPAND BRANCH`;
        btn.dataset.expanded = 'false';

        const childContainer = document.createElement('div');
        childContainer.className = 'branch-children';
        childContainer.style.display = 'none';

        btn.addEventListener('click', () => {
          const expanded = btn.dataset.expanded === 'true';
          if (!expanded) {
            // Generate children if not already generated
            if (node.children.length === 0) {
              if (node.level === 0) {
                node.children = generateLevel1(node, currentMode, searchInput.value.trim());
              } else if (node.level === 1) {
                node.children = generateLevel2(node);
              }
            }
            childContainer.innerHTML = '';
            node.children.forEach(child => {
              childContainer.appendChild(renderNode(child));
            });
            childContainer.style.display = 'block';
            btn.dataset.expanded = 'true';
            btn.classList.add('expanded');
            btn.innerHTML = `<span class="arrow">▶</span> COLLAPSE BRANCH`;
          } else {
            childContainer.style.display = 'none';
            btn.dataset.expanded = 'false';
            btn.classList.remove('expanded');
            btn.innerHTML = `<span class="arrow">▶</span> EXPAND BRANCH`;
          }
          setNodeCount(nodeCounter);
        });

        card.appendChild(btn);
        nodeEl.appendChild(card);
        nodeEl.appendChild(childContainer);
      } else {
        // Level 2 — hard stop, no expand button
        if (node.level === 2) {
          const stopLabel = document.createElement('div');
          stopLabel.className = 'max-depth-label';
          stopLabel.textContent = '— MAX DEPTH REACHED —';
          card.appendChild(stopLabel);
        }
        nodeEl.appendChild(card);
      }

      return nodeEl;
    }

    // --- Main scan ---
    function performScan(target) {
      const cfg = modes[currentMode];
      if (!cfg.validate(target)) { showError(cfg.errorMsg); return; }

      scanBtn.disabled = true;
      scanBtn.innerHTML = '<span class="spinner"></span> SCAN';
      setStatus('scanning', 'BUILDING TREE');
      resultsContainer.innerHTML = '';
      nodeCounter = 0;

      // Simulate short delay
      setTimeout(() => {
        const root = makeRootNode(currentMode, target);
        nodeCounter = 1;
        renderTree(root);
        setStatus('done', 'ROOT NODE READY');
        scanBtn.disabled = false;
        scanBtn.innerHTML = '<span>SCAN</span><span style="font-size:0.85rem;">↗</span>';
      }, 600);
    }

    scanBtn.addEventListener('click', () => {
      const v = searchInput.value.trim();
      if (!v) { showError('PLEASE ENTER A TARGET VALUE.'); return; }
      performScan(v);
    });
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); scanBtn.click(); }
    });
    window.addEventListener('load', () => setTimeout(() => searchInput.focus(), 500));
  </script>
</body>
</html>
